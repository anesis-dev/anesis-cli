[package]
name = "registry-lint"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "registry-lint"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
jsonschema = "0.28"
walkdir = "2.4"
anyhow = "1.0"
# Same version the CLI resolves `glob` targets with, so a pattern that lints
# clean here resolves the same way at apply time.
glob = "0.3"
# `toml_contains` detect rules — pinned to the same version as the CLI's Cargo.toml.
toml = "1.0.1"

[dev-dependencies]
tempfile = "3"
