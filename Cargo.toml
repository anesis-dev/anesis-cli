[package]
name = "anesis"
version = "1.0.0"
edition = "2024"
authors = ["Maksym <maksymzhuk759@gmail.com>"]
description = "CLI for scaffolding projects from remote templates and extending them with project addons"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/anesis-dev/anesis-cli"
homepage = "https://anesis-dev.vercel.app"
documentation = "https://docs.rs/anesis"
readme = "README.md"
keywords = ["cli", "scaffold", "template", "addon"]
categories = ["command-line-utilities", "development-tools"]
# edition 2024 + let-chains (main.rs, upgrade.rs)
rust-version = "1.88"

include = [
  "src/**/*",
  "Cargo.toml",
  "LICENSE.md",
  "/README.md",
  "CHANGELOG.md",
  "COMPATIBILITY.md",
]

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo", "color", "string"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
inquire = "0.9.3"
indicatif = "0.18.3"
colored = "3.1.1"
minijinja = "2"
tokio = { version = "1.36", features = ["rt", "macros", "net", "time"] }
ignore = "0.4"
tempfile = "3.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
toml = "1.0.1"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
  "stream",
] }
zip = "8.1.0"
tar = "0.4"
flate2 = "1.0"
futures = "0.3"
anyhow = "1.0"
thiserror = "2.0.18"
glob = "0.3"
regex = "1.10"
semver = "1.0"
dirs = "6.0"
which = "7"
ctrlc = "3.5.2"
chrono = "0.4.43"
comfy-table = "7"
crossterm = "0.29"
axum = "0.8.8"
open = "5.3.3"
url = "2.5.8"
uuid = { version = "1", features = ["v4"] }
log = "0.4.29"
env_logger = "0.11.10"
dotenvy = "0.15.7"
base64 = "0.22"
sha2 = "0.10"
clap_mangen = "0.3.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
assert_fs = "1.1"
# `--json` output is a public v1.0 contract. Snapshots make an accidental key
insta = { version = "1.43", features = ["json", "redactions"] }
wiremock = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# `panic = "abort"` is deliberately NOT set. The picker puts the terminal into
# raw mode on the alternate screen and restores it from a `Drop` guard; aborting
# skips every destructor, so a panic mid-picker left the user's shell unusable.
# Unwinding also lets the panic hook in `main.rs` print a report-a-bug message.

[profile.dev]
opt-level = 0
debug = true

[[bin]]
name = "anesis"
path = "src/main.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
