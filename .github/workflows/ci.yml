name: CI

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main, dev]
    schedule:
        - cron: "0 6 * * 1"
    workflow_dispatch: {}

env:
    CARGO_TERM_COLOR: always

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    ci:
        name: ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        if: github.event_name != 'schedule'

        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]

        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
              with:
                  components: rustfmt, clippy

            - name: Cache cargo build
              uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
              with:
                  key: ${{ matrix.os }}

            - name: Install nextest
              uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
              with:
                  tool: cargo-nextest

            - name: Format check
              if: matrix.os == 'ubuntu-latest'
              run: cargo fmt --all -- --check

            - name: Clippy
              run: cargo clippy --all-targets -- -D warnings

            - name: Test
              run: cargo nextest run

            - name: Verify the crate packages cleanly
              if: matrix.os == 'ubuntu-latest'
              run: cargo publish --dry-run --locked

    coverage:
        name: Coverage floor
        runs-on: ubuntu-latest
        if: github.event_name != 'schedule'

        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
              with:
                  components: llvm-tools-preview

            - name: Cache cargo build
              uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
              with:
                  key: coverage

            - name: Install cargo-llvm-cov and cargo-nextest
              uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
              with:
                  tool: cargo-llvm-cov,cargo-nextest

            - name: Measure and enforce
              run: cargo llvm-cov nextest --summary-only --fail-under-lines 68

    registry-lint-tool:
        name: registry-lint tool
        runs-on: ubuntu-latest
        if: github.event_name != 'schedule'

        defaults:
            run:
                working-directory: tools/registry-lint

        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
              with:
                  components: rustfmt, clippy

            - name: Cache cargo build
              uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
              with:
                  workspaces: tools/registry-lint

            - name: Format check
              run: cargo fmt --all -- --check

            - name: Clippy
              run: cargo clippy --all-targets -- -D warnings

            - name: Test
              run: cargo test

            - name: Verify the vendored schemas match the server's
              working-directory: .
              env:
                  SCHEMA_BASE_URL: https://anesis-server.onrender.com/schema
              run: |
                  set -euo pipefail
                  failed=0
                  for schema in tools/registry-lint/schemas/*.json; do
                    name=$(basename "$schema")
                    remote="$SCHEMA_BASE_URL/$name"
                    if ! curl --fail --silent --show-error --location --max-time 10 "$remote" -o "/tmp/$name"; then
                      echo "::warning file=$schema::could not reach $remote - skipping the drift check for $name (server may be asleep/down; this does not fail the build)"
                      continue
                    fi
                    # jq normalises key order and whitespace, so a purely cosmetic
                    # difference in the served copy does not fail the build.
                    if ! diff -u <(jq -S . "/tmp/$name") <(jq -S . "$schema"); then
                      echo "::error file=$schema::vendored schema has drifted from the deployed server"
                      failed=1
                    fi
                  done
                  exit "$failed"

    security:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Install cargo-audit and cargo-deny
              uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
              with:
                  tool: cargo-audit,cargo-deny

            - name: cargo audit
              run: cargo audit

            - name: cargo deny
              run: cargo deny check

            - name: cargo audit (registry-lint tool)
              working-directory: tools/registry-lint
              run: cargo audit

    mutants:
        name: Mutation testing (weekly)
        runs-on: ubuntu-latest
        if: github.event_name == 'schedule'

        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

            - name: Cache cargo build
              uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
              with:
                  key: mutants

            - name: Install cargo-mutants and cargo-nextest
              uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
              with:
                  tool: cargo-mutants,cargo-nextest

            - name: cargo mutants
              run: |
                  cargo mutants \
                    --file 'src/addons/steps/**' \
                    --file 'src/addons/runner.rs' \
                    --file 'src/utils/archive.rs' \
                    --file 'src/utils/validate.rs' \
                    --file 'src/addons/lock.rs' \
                    --timeout 60 \
                    --test-tool nextest

            - name: Upload mutants report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: mutants-report
                  path: mutants.out
