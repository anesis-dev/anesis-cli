name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: read

jobs:
    check:
        name: Check versions
        runs-on: ubuntu-latest
        outputs:
            changelog: ${{ steps.changelog.outputs.body }}
        steps:
            - uses: actions/checkout@v4

            - name: Verify versions match tag
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  CARGO_VER=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
                  NPM_VER=$(node -p "require('./npm/package.json').version")
                  [ "$CARGO_VER" = "$VERSION" ] || { echo "Cargo.toml=$CARGO_VER != tag=$VERSION"; exit 1; }
                  [ "$NPM_VER" = "$VERSION" ] || { echo "npm/package.json=$NPM_VER != tag=$VERSION"; exit 1; }

            - name: Extract this version's CHANGELOG.md entry
              id: changelog
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  BODY=$(awk -v ver="$VERSION" '
                    /^## \[/ {
                      if (found) exit
                      if ($0 ~ "^## \\[" ver "\\]") { found=1; next }
                      next
                    }
                    found { print }
                  ' CHANGELOG.md)
                  BODY=$(printf '%s\n' "$BODY" | sed -e '/./,$!d' -e ':a;/^\n*$/{$d;N;ba}')
                  if [ -z "$BODY" ]; then
                    echo "::error::CHANGELOG.md has no '## [$VERSION]' entry — add one before tagging a release."
                    exit 1
                  fi
                  {
                    echo "body<<CHANGELOG_EOF"
                    echo "$BODY"
                    echo "CHANGELOG_EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

            - name: Verify crates.io packaging
              run: cargo publish --dry-run --locked

    build:
        name: Build & test ${{ matrix.name }}
        needs: check
        runs-on: ${{ matrix.os }}
        permissions:
            contents: write

        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      name: linux-x86_64
                    - os: ubuntu-24.04-arm
                      target: aarch64-unknown-linux-gnu
                      name: linux-aarch64
                    - os: macos-latest
                      target: aarch64-apple-darwin
                      name: macos-aarch64
                    - os: macos-15-intel
                      target: x86_64-apple-darwin
                      name: macos-x86_64
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      name: windows-x86_64

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
              with:
                  targets: ${{ matrix.target }}

            - name: Install dependencies (Linux)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y pkg-config libssl-dev

            - name: Cache cargo
              uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
              with:
                  key: ${{ matrix.target }}

            - name: Install cargo-nextest
              uses: taiki-e/install-action@154e354fb1a868a1e88d0f08c1e5e9118f8f049d # nextest

            - name: Run tests
              run: cargo nextest run --all-features --locked --target ${{ matrix.target }}

            - name: Build release binary
              run: cargo build --release --locked --target ${{ matrix.target }}

            - name: Package (Unix)
              if: runner.os != 'Windows'
              run: |
                  cd target/${{ matrix.target }}/release
                  tar czf ../../../anesis-${{ matrix.name }}.tar.gz anesis

            - name: Package (Windows)
              if: runner.os == 'Windows'
              run: |
                  cd target/${{ matrix.target }}/release
                  7z a ../../../anesis-${{ matrix.name }}.zip anesis.exe

            - name: Upload to release
              uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
              with:
                  body: ${{ needs.check.outputs.changelog }}
                  files: |
                      anesis-*.tar.gz
                      anesis-*.zip

            - name: Upload archive as workflow artifact
              uses: actions/upload-artifact@v4
              with:
                  name: archive-${{ matrix.name }}
                  path: |
                      anesis-*.tar.gz
                      anesis-*.zip
                  if-no-files-found: error

    man:
        name: Publish man pages
        needs: check
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

            - name: Generate man pages
              run: |
                  cargo run --release --locked -- man man/
                  tar czf anesis-man.tar.gz man/
                  ls man/

            - name: Upload man pages to release
              uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
              with:
                  body: ${{ needs.check.outputs.changelog }}
                  files: anesis-man.tar.gz

            - name: Upload man pages as workflow artifact
              uses: actions/upload-artifact@v4
              with:
                  name: archive-man
                  path: anesis-man.tar.gz
                  if-no-files-found: error

    checksums:
        name: Publish SHA256SUMS
        needs: [check, build, man]
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - name: Download all archives
              uses: actions/download-artifact@v4
              with:
                  pattern: archive-*
                  merge-multiple: true
                  path: dist

            - name: Generate SHA256SUMS
              working-directory: dist
              run: |
                  shasum -a 256 anesis-* | sort -k2 > SHA256SUMS
                  cat SHA256SUMS

            - name: Attest provenance for the release archives and SHA256SUMS
              uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
              with:
                  subject-path: dist/*

            - name: Upload SHA256SUMS to release
              uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
              with:
                  body: ${{ needs.check.outputs.changelog }}
                  files: dist/SHA256SUMS

    packaging:
        name: Update Scoop bucket and Homebrew tap
        needs: checksums
        runs-on: ubuntu-latest
        if: ${{ github.repository_owner == 'anesis-dev' }}
        steps:
            - uses: actions/checkout@v4

            - name: Check for the packaging token
              id: gate
              env:
                  PACKAGING_TOKEN: ${{ secrets.PACKAGING_TOKEN }}
              run: |
                  if [ -n "$PACKAGING_TOKEN" ]; then
                    echo "enabled=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "enabled=false" >> "$GITHUB_OUTPUT"
                    echo "PACKAGING_TOKEN is not set - skipping. See packaging/README.md."
                  fi

            - name: Download SHA256SUMS from the release
              if: steps.gate.outputs.enabled == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS --dir .

            - name: Render manifests
              if: steps.gate.outputs.enabled == 'true'
              run: packaging/render.sh "$GITHUB_REF_NAME" SHA256SUMS rendered/

            - name: Push to the Scoop bucket and the Homebrew tap
              if: steps.gate.outputs.enabled == 'true'
              env:
                  PACKAGING_TOKEN: ${{ secrets.PACKAGING_TOKEN }}
                  VERSION: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  git config --global user.name  "anesis-release-bot"
                  git config --global user.email "bot@anesis.dev"

                  push_manifest() {
                    repo="$1" src="$2" dest="$3"
                    work="$(mktemp -d)"
                    git clone --depth 1 \
                      "https://x-access-token:${PACKAGING_TOKEN}@github.com/${repo}.git" "$work"
                    mkdir -p "$work/$(dirname "$dest")"
                    cp "$src" "$work/$dest"
                    git -C "$work" add "$dest"
                    if git -C "$work" diff --cached --quiet; then
                      echo "$repo is already at $VERSION"
                      return
                    fi
                    git -C "$work" commit -m "anesis $VERSION"
                    git -C "$work" push
                  }

                  push_manifest anesis-dev/scoop-anesis    rendered/bucket/anesis.json bucket/anesis.json
                  push_manifest anesis-dev/homebrew-anesis rendered/Formula/anesis.rb  Formula/anesis.rb

    publish-crates:
        name: Publish to crates.io
        needs: checksums
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

            - name: Publish
              run: cargo publish --locked
              env:
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    publish-npm:
        name: Publish to npm
        needs: checksums
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  registry-url: "https://registry.npmjs.org"

            - name: Set version from tag
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  node -e "
                    const fs = require('fs');
                    const p = JSON.parse(fs.readFileSync('npm/package.json', 'utf8'));
                    p.version = '${VERSION}';
                    p.binaryVersion = '${VERSION}';
                    fs.writeFileSync('npm/package.json', JSON.stringify(p, null, 2) + '\n');
                  "

            - name: Publish
              run: npm publish --access public --provenance
              working-directory: npm
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
