[graph]
all-features = false

[advisories]
ignore = []

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  "bzip2-1.0.6",
  "MPL-2.0",
]

[[licenses.exceptions]]
# anesis's own license (LICENSE.md) - not third-party, but cargo-deny still
# checks the local crate against the license expression in its manifest.
name = "anesis"
allow = ["PolyForm-Noncommercial-1.0.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  { name = "serde_yaml" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
